openapi: 3.0.3
info:
  title: Generated API
  version: 1.0.0
  description: Endpoints implemented by the generated prototype slice.
paths:
  /v1/warehouses:
    post:
      summary: Create a warehouse
      responses:
        "201": { description: OK }
  /v1/warehouses:
    get:
      summary: List warehouses
      responses:
        "200": { description: OK }
  /v1/products:
    post:
      summary: Create a product/SKU
      responses:
        "201": { description: OK }
  /v1/products:
    get:
      summary: List products
      responses:
        "200": { description: OK }
  /v1/stock:
    post:
      summary: Add new stock (initial quantity) for a product/SKU at a warehouse
      responses:
        "201": { description: OK }
  /v1/stock/adjustments:
    post:
      summary: Adjust stock (increment/decrement/set) with reason; idempotent via Idempotency-Key header
      responses:
        "200": { description: OK }
  /v1/stock/{warehouse_id}/{product_id}:
    get:
      summary: Get current stock level for a product at a specific warehouse
      responses:
        "200": { description: OK }
  /v1/products/{product_id}/stock:
    get:
      summary: Get stock levels for a product across all warehouses
      responses:
        "200": { description: OK }
  /v1/warehouses/{warehouse_id}/stock:
    get:
      summary: List all products and their stock levels within a warehouse
      responses:
        "200": { description: OK }
  /v1/thresholds/{warehouse_id}/{product_id}:
    put:
      summary: Set or update low-stock threshold for a product-warehouse pair
      responses:
        "200": { description: OK }
  /v1/alerts:
    get:
      summary: List currently active low-stock alerts
      responses:
        "200": { description: OK }
  /v1/audit:
    get:
      summary: Query stock adjustment audit log, filterable by warehouse/product/date range
      responses:
        "200": { description: OK }
