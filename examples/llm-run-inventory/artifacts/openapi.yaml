openapi: 3.0.3
info:
  title: Generated API
  version: 1.0.0
  description: "Synthesized by the Repair agent from the API design; lists only endpoints the generated slice serves."
paths:
  # design-level endpoint(s) not in this slice: GET /openapi.json
  "/items":
    post:
      summary: "Register a new inventory item"
      responses:
        "201":
          description: "{id, sku, name, metadata, created_at}"
    get:
      summary: "List items with pagination/filtering by sku/name"
      responses:
        "200":
          description: "{items:[...], page, page_size, total}"
  "/items/{item_id}":
    parameters:
      - name: "item_id"
        in: path
        required: true
        schema: { type: string }
    get:
      summary: "Get item details"
      responses:
        "200":
          description: "{id, sku, name, metadata, created_at}"
  "/warehouses":
    post:
      summary: "Register a new warehouse"
      responses:
        "201":
          description: "{id, code, name, location}"
    get:
      summary: "List all warehouses with inventory summary (total qty, distinct items, low-stock count)"
      responses:
        "200":
          description: "{warehouses:[{id, code, name, total_quantity, item_count, low_stock_count}], page, page_size, total}"
  "/stock/add":
    post:
      summary: "Add stock quantity for item in a warehouse (creates stock row if absent)"
      responses:
        "200":
          description: "{item_id, warehouse_id, quantity, updated_at}"
  "/stock/adjust":
    post:
      summary: "Adjust stock (positive or negative delta) with audit trail and idempotency"
      responses:
        "200":
          description: "{item_id, warehouse_id, quantity, delta_applied, adjustment_id, alert_triggered}"
  "/stock/{item_id}/{warehouse_id}":
    parameters:
      - name: "item_id"
        in: path
        required: true
        schema: { type: string }
      - name: "warehouse_id"
        in: path
        required: true
        schema: { type: string }
    get:
      summary: "Query current stock level for an item in a specific warehouse"
      responses:
        "200":
          description: "{item_id, warehouse_id, quantity, low_stock_threshold, updated_at}"
  "/stock/{item_id}":
    parameters:
      - name: "item_id"
        in: path
        required: true
        schema: { type: string }
    get:
      summary: "Query aggregated stock levels across all warehouses for an item"
      responses:
        "200":
          description: "{item_id, total_quantity, by_warehouse:[{warehouse_id, quantity}]}"
  "/stock":
    get:
      summary: "List stock records with pagination and filtering by item_id/warehouse_id/low_stock_only"
      responses:
        "200":
          description: "{records:[...], page, page_size, total}"
  "/stock/{item_id}/{warehouse_id}/threshold":
    parameters:
      - name: "item_id"
        in: path
        required: true
        schema: { type: string }
      - name: "warehouse_id"
        in: path
        required: true
        schema: { type: string }
    put:
      summary: "Configure low-stock threshold for an item/warehouse pair"
      responses:
        "200":
          description: "{item_id, warehouse_id, low_stock_threshold}"
  "/alerts/low-stock":
    get:
      summary: "List current low-stock conditions (stock below threshold) across items/warehouses"
      responses:
        "200":
          description: "{alerts:[{item_id, warehouse_id, quantity, threshold}], page, page_size, total}"
  "/alerts":
    get:
      summary: "List historical triggered alerts with pagination/filtering by status/date"
      responses:
        "200":
          description: "{alerts:[...], page, page_size, total}"
  "/audit/adjustments":
    get:
      summary: "Query audit history of stock adjustments with pagination/filtering"
      responses:
        "200":
          description: "{records:[{id, item_id, warehouse_id, delta, reason, actor, resulting_quantity, created_at}], page, page_size, total}"
