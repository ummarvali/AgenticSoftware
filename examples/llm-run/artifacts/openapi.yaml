openapi: 3.0.3
info:
  title: Generated API
  version: 1.0.0
  description: Endpoints implemented by the generated prototype slice.
paths:
  /api/v1/urls:
    post:
      summary: Create a short URL from a long URL, optional custom alias and TTL
      responses:
        "201": { description: OK }
  /{short_code}:
    get:
      summary: Redirect to the original long URL and asynchronously record a click event
      responses:
        "302": { description: OK }
  /api/v1/urls/{short_code}:
    get:
      summary: Get metadata for a short URL (owner or public info)
      responses:
        "200": { description: OK }
  /api/v1/urls/{short_code}/analytics:
    get:
      summary: Retrieve aggregated analytics for a short URL
      responses:
        "200": { description: OK }
  /api/v1/urls/{short_code}:
    delete:
      summary: Deactivate (soft-delete) a short URL; owner-only if authenticated
      responses:
        "200": { description: OK }
  /api/v1/auth/register:
    post:
      summary: Register a new user and receive an API key
      responses:
        "201": { description: OK }
  /api/v1/auth/login:
    post:
      summary: Authenticate and retrieve/rotate API key
      responses:
        "200": { description: OK }
  /openapi.json:
    get:
      summary: Serve OpenAPI specification for API documentation
      responses:
        "200": { description: OK }
