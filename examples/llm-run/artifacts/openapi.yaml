openapi: 3.0.3
info:
  title: URL Shortener API
  description: >
    Creates and resolves short URLs, supports custom aliases and expiration,
    bulk creation, per-owner management via API key, and click analytics.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
paths:
  /api/urls:
    post:
      summary: Create a short URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [long_url]
              properties:
                long_url:
                  type: string
                  example: "https://example.com/some/long/path"
                custom_alias:
                  type: string
                  nullable: true
                  example: "my-alias"
                expires_at:
                  type: string
                  nullable: true
                  format: date-time
      parameters:
        - in: header
          name: X-API-Key
          required: false
          schema:
            type: string
      responses:
        "201":
          description: Short URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUrlResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Custom alias already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/urls/bulk:
    post:
      summary: Create multiple short URLs in one request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  items:
                    type: object
                    properties:
                      long_url:
                        type: string
                      custom_alias:
                        type: string
                        nullable: true
                      expires_at:
                        type: string
                        nullable: true
      parameters:
        - in: header
          name: X-API-Key
          required: false
          schema:
            type: string
      responses:
        "201":
          description: Bulk results (per-item success or error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/BulkResultItem"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /{short_code}:
    get:
      summary: Redirect to the original long URL
      parameters:
        - in: path
          name: short_code
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the long URL
          headers:
            Location:
              schema:
                type: string
        "404":
          description: Short code not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/urls/{short_code}/stats:
    get:
      summary: Retrieve click analytics for a short URL
      parameters:
        - in: path
          name: short_code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stats for the short URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
        "404":
          description: Short code not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/urls/{short_code}:
    put:
      summary: Update the long URL and/or expiration of a short URL
      parameters:
        - in: path
          name: short_code
          required: true
          schema:
            type: string
        - in: header
          name: X-API-Key
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                long_url:
                  type: string
                  nullable: true
                expires_at:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller does not own this short URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Short code not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Deactivate (soft-delete) a short URL
      parameters:
        - in: path
          name: short_code
          required: true
          schema:
            type: string
        - in: header
          name: X-API-Key
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "403":
          description: Caller does not own this short URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Short code not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/keys:
    post:
      summary: Create an API key for managing owned URLs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner_name]
              properties:
                owner_name:
                  type: string
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
        "400":
          description: owner_name missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    CreateUrlResponse:
      type: object
      properties:
        short_code:
          type: string
        short_url:
          type: string
        long_url:
          type: string
        expires_at:
          type: string
          nullable: true
        created_at:
          type: string
    BulkResultItem:
      type: object
      properties:
        long_url:
          type: string
        short_code:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
    StatsResponse:
      type: object
      properties:
        short_code:
          type: string
        long_url:
          type: string
        total_clicks:
          type: integer
        last_click_at:
          type: string
          nullable: true
        recent_events:
          type: array
          items:
            type: object
            properties:
              ts:
                type: string
              referrer:
                type: string
                nullable: true
              user_agent:
                type: string
                nullable: true
              ip:
                type: string
                nullable: true
    UpdateResponse:
      type: object
      properties:
        short_code:
          type: string
        long_url:
          type: string
        expires_at:
          type: string
          nullable: true
        updated:
          type: boolean
    DeleteResponse:
      type: object
      properties:
        short_code:
          type: string
        deleted:
          type: boolean
    ApiKeyResponse:
      type: object
      properties:
        api_key:
          type: string
        owner_name:
          type: string
        created_at:
          type: string
