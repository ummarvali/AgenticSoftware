openapi: 3.0.3
info:
  title: URL Shortener API
  version: "1.0.0"
  description: >
    Prototype URL shortener API implemented with the Python standard
    library. Provides creation, redirection, metadata retrieval, deletion
    and analytics for short URLs.
servers:
  - url: /api/v1
paths:
  /urls:
    post:
      summary: Create a short URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [long_url]
              properties:
                long_url:
                  type: string
                  example: "https://example.com/some/long/path"
                custom_alias:
                  type: string
                  nullable: true
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
      security:
        - bearerAuth: []
        - {}
      responses:
        "201":
          description: Short URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUrlResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Custom alias already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /{short_code}:
    get:
      summary: Redirect to the original long URL
      parameters:
        - $ref: "#/components/parameters/ShortCode"
      responses:
        "302":
          description: Redirect to long URL
          headers:
            Location:
              schema:
                type: string
        "404":
          description: Short code not found, inactive, or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /urls/{short_code}:
    get:
      summary: Get metadata for a short URL
      parameters:
        - $ref: "#/components/parameters/ShortCode"
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UrlMetadata"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Deactivate (soft-delete) a short URL
      parameters:
        - $ref: "#/components/parameters/ShortCode"
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  short_code:
                    type: string
                  is_active:
                    type: boolean
        "403":
          description: Not authorized to modify this short URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /urls/{short_code}/analytics:
    get:
      summary: Get aggregated analytics for a short URL
      parameters:
        - $ref: "#/components/parameters/ShortCode"
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Aggregated analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analytics"
        "403":
          description: Not authorized to view analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users:
    post:
      summary: Create a user and obtain an API token
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                  api_token:
                    type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ShortCode:
      name: short_code
      in: path
      required: true
      schema:
        type: string
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    CreateUrlResponse:
      type: object
      properties:
        short_code:
          type: string
        short_url:
          type: string
        long_url:
          type: string
        created_at:
          type: string
        expires_at:
          type: string
          nullable: true
    UrlMetadata:
      type: object
      properties:
        short_code:
          type: string
        long_url:
          type: string
        created_at:
          type: string
        expires_at:
          type: string
          nullable: true
        click_count:
          type: integer
        is_active:
          type: boolean
        owner_id:
          type: string
          nullable: true
    Analytics:
      type: object
      properties:
        short_code:
          type: string
        total_clicks:
          type: integer
        clicks_by_day:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              count:
                type: integer
        top_referrers:
          type: array
          items:
            type: object
            properties:
              referrer:
                type: string
              count:
                type: integer
        geo_distribution:
          type: array
          items:
            type: object
            properties:
              country:
                type: string
              count:
                type: integer

