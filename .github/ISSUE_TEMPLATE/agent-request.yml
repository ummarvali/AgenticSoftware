name: Agent request
description: Ask the agent pipeline to turn a requirement into a reviewed pull request.
title: "[agent] "
labels: ["agent-request"]
body:
  - type: markdown
    attributes:
      value: |
        Keep the `[agent]` prefix in the title — it is what starts the run.

        Write your requirement in plain language and pick where it applies. You do not
        classify it: the agent works out whether it is new work or a change, and whether it is
        clear enough to build. If it leaves open *what* to build, the agent asks its questions
        here first — reply with a comment that starts with `/answer`.

        Examples:
        - `Build a scalable URL shortener service with APIs, persistence, and analytics.` → **New project** (the mandatory use case)
        - `Add rate limiting to the existing URL shortener API to prevent abuse.` → **Change to demo/**
        - `Add tests for the error cases of the stats endpoint.` or a bug fix / refactor → **Change to demo/**
        - `Make the app faster.` → **Change to demo/** (vague on purpose: expect questions first)

        A maintainer approves each run before the model is called. The result is posted here,
        and if the maintainer accepts it, a pull request follows (about 6–12 minutes per run).
  - type: textarea
    id: requirement
    attributes:
      label: Requirement
      description: Plain language, up to 2000 characters.
      value: "Build a scalable URL shortener service with APIs, persistence, and analytics."
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target
      description: A new project, or a change to the existing service in this repository.
      options:
        - "New project"
        - "Change to demo/ (the existing URL shortener service)"
      default: 0
    validations:
      required: true
