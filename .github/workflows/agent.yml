# The agent as a team pipeline — the production operating model.
#
# Nobody runs the model from a laptop or holds the key. A request comes in (a maintainer's
# "Run workflow", or an issue opened from the "Agent request" form), a maintainer approves
# the run before the model is called, the agent runs in CI with the key from a GitHub
# Environment secret, its result is published on the run page (and on the issue), and the
# run then WAITS for a human to accept it (GitHub Environment "agent-acceptance"). Only an
# accepted run becomes a pull request — so the proposal lands in normal code review and CI.
#
# Why two environments: they gate two different decisions. "agent-run" guards the key and
# the spend (who may start a model run, from which branch); "agent-acceptance" is the
# engineering sign-off on what the agent produced. GitHub approvals happen before a job
# starts, so the sign-off needs its own job after the run.
#
# Who can use the key: GitHub secrets are encrypted, write-only (nobody can read one back,
# including the owner) and masked in logs. There is no pull_request trigger, so forks cannot
# run this with the key. Anyone may open an issue, but an issue run waits for a required
# reviewer of "agent-run" before the key is released, and that environment is limited to
# the main branch, so a workflow edited on any other branch cannot reach the key either.
# Issue text is untrusted: scripts/pipeline_request.py parses it (preset scenarios, a
# length cap, an allow-listed target folder) and it reaches the agent only as data.
#
# One-time setup (repository Settings):
#   1. Environments → New environment "agent-run" → Required reviewers: the maintainers
#      who approve spend (required, since issues can start runs) → Deployment branches and
#      tags: "Selected branches" → main → Environment secrets: ANTHROPIC_API_KEY
#      (or OPENAI_API_KEY for provider=openai).
#   2. Environments → New environment "agent-acceptance" → Required reviewers: the
#      people allowed to accept agent output.
#   3. Actions → General → Workflow permissions: "Allow GitHub Actions to create and
#      approve pull requests" (jobs request the write scopes they need themselves).
name: Agent pipeline

on:
  workflow_dispatch:
    inputs:
      requirement:
        description: "Requirement in plain language"
        required: true
        default: "Build a scalable URL shortener service with APIs, persistence, and analytics."
      repo_path:
        description: "Brownfield: folder in this repository to change (e.g. demo). Leave empty for greenfield."
        required: false
        default: ""
      provider:
        description: "Reasoning backend"
        required: true
        default: claude
        type: choice
        options: [claude, openai, deterministic]
  issues:
    types: [opened]              # the "Agent request" issue form (title starts with [agent])

permissions:
  contents: read

concurrency:
  # One run per request; spend is bounded by the approval on "agent-run" and the model
  # workspace's spend limit rather than by queueing (a queue would drop waiting requests).
  group: agent-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  request:
    name: resolve the request
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[agent]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      requirement: ${{ steps.resolve.outputs.requirement }}
      repo_path: ${{ steps.resolve.outputs.repo_path }}
      provider: ${{ steps.resolve.outputs.provider }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the request (untrusted text is parsed as data, never run)
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          IN_REQUIREMENT: ${{ inputs.requirement }}
          IN_REPO_PATH: ${{ inputs.repo_path }}
          IN_PROVIDER: ${{ inputs.provider }}
        run: python scripts/pipeline_request.py resolve
      - name: Acknowledge on the issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OK: ${{ steps.resolve.outcome == 'success' }}
          ERROR: ${{ steps.resolve.outputs.error }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OK" = true ]; then
            msg="Request received — [pipeline run]($RUN_URL). **Waiting for a maintainer to approve the spend** (a manual step, so it can take a while). The run then takes about 6–12 minutes and its result is posted here."
          else
            msg="This request could not be started: ${ERROR:-invalid request}. Please open a new issue from the **Agent request** form."
          fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$msg"

  run-agent:
    name: agent run (plan → build → validate → summarize)
    needs: request
    runs-on: ubuntu-latest
    environment: agent-run             # the key is this environment's secret, main branch only
    timeout-minutes: 45
    outputs:
      run_id: ${{ steps.agent.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false      # no token left in .git/config for generated code to find
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (model SDKs are optional extras)
        run: python -m pip install -e ".[anthropic,llm]"
      - name: Hand the model key to the agent as a file (never in its environment)
        id: key
        env:
          # The secret exists only in this short step (and is empty unless the run is on
          # main: the environment's branch rule). It is written to a private file that the
          # agent reads and deletes at start-up, so the key is never in the agent's initial
          # environment, which is what /proc/<pid>/environ exposes to child processes such
          # as the model-written tests the agent executes during validation.
          PROVIDER: ${{ needs.request.outputs.provider }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          umask 077
          case "$PROVIDER" in
            claude) name=ANTHROPIC_API_KEY; value="$ANTHROPIC_API_KEY" ;;
            openai) name=OPENAI_API_KEY; value="$OPENAI_API_KEY" ;;
            *) exit 0 ;;
          esac
          # Fail fast without a key: otherwise every stage would fall back to the
          # deterministic engine and template output would reach review.
          if [ -z "$value" ]; then echo "::error::secret $name is not set"; exit 1; fi
          printf '%s' "$value" > "$RUNNER_TEMP/model.key"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Run the agent (non-interactive; human approval happens in the next job)
        id: agent
        env:
          KEY_VAR: ${{ steps.key.outputs.name }}
          PYTHONPATH: src
          # Inputs are passed as environment variables, never interpolated into the
          # script, so a crafted requirement cannot inject shell commands.
          REQUIREMENT: ${{ needs.request.outputs.requirement }}
          REPO_PATH: ${{ needs.request.outputs.repo_path }}
          PROVIDER: ${{ needs.request.outputs.provider }}
        run: |
          set +e
          if [ -n "$KEY_VAR" ]; then export "${KEY_VAR}_FILE=$RUNNER_TEMP/model.key"; fi
          args=(--provider "$PROVIDER" --output-root runs)
          if [ -n "$REPO_PATH" ]; then args+=(--repo "$REPO_PATH"); fi
          # "--" so a requirement starting with "-" is never read as an option.
          python -u -m agentic_sdlc "${args[@]}" -- "$REQUIREMENT"
          rc=$?
          run_dir=$(ls -d runs/* 2>/dev/null | tail -1)
          # A model run is only reviewable if the model did the work: any stage that
          # fell back to the deterministic engine fails the job before the gate.
          if [ $rc -eq 0 ] && [ "$PROVIDER" != deterministic ]; then
            python - "$run_dir/result.json" <<'PY' || rc=1
          import json, sys
          llm = json.load(open(sys.argv[1]))["metrics"].get("llm") or {}
          if llm.get("fallbacks", 1):
              print("::error::a model stage fell back to the deterministic engine "
                    f"(fallbacks={llm.get('fallbacks')}); not sending it for acceptance")
              sys.exit(1)
          PY
          fi
          echo "run_id=$(basename "$run_dir")" >> "$GITHUB_OUTPUT"
          if [ -f "$run_dir/artifacts/ENGINEERING_SUMMARY.md" ]; then
            cat "$run_dir/artifacts/ENGINEERING_SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc   # a failing or halted run never reaches the approval gate
      - name: Publish the run record (always — failures are evidence too)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-run
          path: runs/
          retention-days: 30
          overwrite: true                 # a re-run replaces the record instead of failing

  report:
    name: post the result on the issue
    needs: [request, run-agent]
    if: always() && github.event_name == 'issues' && needs.request.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        continue-on-error: true           # absent when the run was rejected or stopped early
        with:
          name: agent-run
          path: runs/
      - name: Comment with the verdict and the engineering summary
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_ID: ${{ needs.run-agent.outputs.run_id }}
          OUTCOME: ${{ needs.run-agent.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$RUN_ID" ] && [ -f "runs/$RUN_ID/result.json" ]; then
            python scripts/pipeline_request.py report "runs/$RUN_ID" > comment.md
          else
            echo "**The run was not approved, or stopped before producing a result.**" > comment.md
          fi
          {
            echo
            if [ "$OUTCOME" = success ]; then
              echo "Next: a maintainer reviews this result and accepts or rejects it; on acceptance a pull request is opened and linked here."
            else
              echo "This run did not pass its gates, so it will not be offered for acceptance."
            fi
            echo "Full console log and run record: [pipeline run]($RUN_URL)"
          } >> comment.md
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file comment.md

  accept:
    name: human acceptance → pull request
    needs: [request, run-agent]
    runs-on: ubuntu-latest
    environment: agent-acceptance      # pauses here until a required reviewer approves
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # This job holds a write token, so it never executes generated code: it only copies
      # the accepted files onto a branch. The code was compiled, scanned and tested in the
      # read-only agent-run job.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: agent-run
          path: runs/
      - name: Apply the accepted proposal to a branch and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.run-agent.outputs.run_id }}
          REQUIREMENT: ${{ needs.request.outputs.requirement }}
          REPO_PATH: ${{ needs.request.outputs.repo_path }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          branch="agent/${RUN_ID}"
          git config user.name "agentic-sdlc[bot]"
          git config user.email "agentic-sdlc@users.noreply.github.com"
          git checkout -b "$branch"
          if [ -n "$REPO_PATH" ]; then
            python scripts/apply_change.py "runs/${RUN_ID}" --repo "$REPO_PATH"
          else
            python scripts/apply_change.py "runs/${RUN_ID}"
          fi
          git add -A
          title=$(printf '%s\n' "$REQUIREMENT" | head -n 1 | cut -c1-70)
          git commit -m "Agent proposal ${RUN_ID}: ${title}"
          # The branch belongs to this run, so a re-run of this job replaces it.
          git push --force origin "$branch"
          cp "runs/${RUN_ID}/artifacts/ENGINEERING_SUMMARY.md" pr-body.md
          if [ -n "$ISSUE" ]; then printf '\n\nRequested in #%s.\n' "$ISSUE" >> pr-body.md; fi
          # Re-run safe: reuse the pull request if an earlier attempt already opened it.
          pr_url=$(gh pr view "$branch" --json url --jq .url 2>/dev/null) ||
            pr_url=$(gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
              --title "Agent: ${title}" --body-file pr-body.md)
          echo "Pull request: $pr_url"
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --body "Accepted by a maintainer — pull request: $pr_url"
          fi

  not-accepted:
    name: tell the issue when a result is not accepted
    needs: [request, run-agent, accept]
    if: >-
      always() && github.event_name == 'issues'
      && needs.run-agent.result == 'success' && needs.accept.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "Not accepted: the maintainer rejected this result at review, or the pull-request step failed ([pipeline run]($RUN_URL)). No pull request will be opened for this run."
